<style>
/* ── Reset ────────────────────────────────────────────── */
#ce-chat-wrap * { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Variables ───────────────────────────────────────── */
#ce-chat-wrap {
  --ce-ink:       #0a0c14;
  --ce-blue:      #0057b8;
  --ce-blue-mid:  #004299;
  --ce-blue-deep: #001f5c;
  --ce-accent:    #e63946;
  --ce-gold:      #f4a932;
  --ce-surface:   #ffffff;
  --ce-lift:      #f8f9fd;
  --ce-muted:     #f0f2f8;
  --ce-border:    rgba(0,87,184,.13);
  --ce-text:      #111827;
  --ce-sub:       #6b7280;
  --ce-radius:    22px;
  --ce-shadow:
    0 2px 4px rgba(0,0,0,.04),
    0 8px 24px rgba(0,40,120,.10),
    0 32px 64px rgba(0,40,120,.14);
  font-family: 'DM Sans', sans-serif;
}

/* ══════════════════════════════════════════
   BOTÓN FLOTANTE
══════════════════════════════════════════ */
#ce-toggle {
  position: fixed;
  bottom: 96px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  z-index: 9998;
  background: linear-gradient(145deg, #1a6fdc 0%, var(--ce-blue) 40%, var(--ce-blue-deep) 100%);
  box-shadow:
    0 4px 12px rgba(0,87,184,.35),
    0 12px 32px rgba(0,40,120,.30),
    inset 0 1px 0 rgba(255,255,255,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, opacity .25s;
  overflow: visible;
}
#ce-toggle:hover {
  transform: scale(1.1) translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,87,184,.4), 0 18px 40px rgba(0,40,120,.35), inset 0 1px 0 rgba(255,255,255,.22);
}
#ce-toggle::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,87,184,.25);
  transition: opacity .3s;
}
#ce-chat-wrap.ce-open #ce-toggle::after { opacity: 0; }

/* Ocultar burbuja cuando el panel está abierto */
#ce-chat-wrap.ce-open #ce-toggle {
  transform: scale(0);
  opacity: 0;
  pointer-events: none;
}

#ce-toggle::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(0,87,184,.35);
  animation: cePulse 2.8s ease-out infinite;
  z-index: -1;
}
#ce-chat-wrap.ce-open #ce-toggle::before { animation: none; opacity: 0; }
@keyframes cePulse {
  0%   { transform: scale(1);    opacity: .7; }
  70%  { transform: scale(1.55); opacity: 0; }
  100% { transform: scale(1.55); opacity: 0; }
}
#ce-toggle .ce-ico {
  width: 26px; height: 26px;
  fill: #fff;
  position: absolute;
  transition: opacity .28s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.2));
}
#ce-toggle .ce-ico-close { opacity: 0; transform: rotate(-90deg) scale(.7); }
#ce-chat-wrap.ce-open #ce-toggle .ce-ico-chat  { opacity: 0; transform: rotate(90deg) scale(.7); }
#ce-chat-wrap.ce-open #ce-toggle .ce-ico-close { opacity: 1; transform: rotate(0deg) scale(1); }

#ce-badge {
  position: absolute;
  top: -3px; right: -3px;
  background: var(--ce-accent);
  color: #fff;
  font-size: 9.5px;
  font-weight: 700;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2.5px solid #fff;
  box-shadow: 0 2px 8px rgba(230,57,70,.5);
  animation: ceBadgePop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes ceBadgePop { from { transform: scale(0); } to { transform: scale(1); } }

/* ══════════════════════════════════════════
   OVERLAY (fondo oscuro)
══════════════════════════════════════════ */
#ce-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,12,20,.45);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 9996;
  opacity: 0;
  pointer-events: none;
  transition: opacity .32s ease;
}
#ce-chat-wrap.ce-open #ce-overlay {
  opacity: 1;
  pointer-events: all;
}

/* ══════════════════════════════════════════
   PANEL DESLIZANTE (reemplaza la ventana flotante)
══════════════════════════════════════════ */
#ce-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 400px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--ce-surface);
  z-index: 9997;
  transform: translateX(100%);
  transition: transform .4s cubic-bezier(.32,.72,0,1);
  box-shadow: -8px 0 40px rgba(0,20,80,.18), -2px 0 8px rgba(0,0,0,.06);
}
#ce-chat-wrap.ce-open #ce-panel {
  transform: translateX(0);
}

/* ══════════════════════════════════════════
   HEADER DEL PANEL
══════════════════════════════════════════ */
.ce-header {
  padding: 0 20px;
  height: 72px;
  display: flex;
  align-items: center;
  gap: 13px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: var(--ce-ink);
}
.ce-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 200% 120% at 110% 50%, rgba(0,87,184,.55) 0%, transparent 60%),
    radial-gradient(ellipse 80% 80% at -10% 50%, rgba(26,111,220,.3) 0%, transparent 60%);
}
.ce-header::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Botón volver */
#ce-back {
  position: relative;
  z-index: 1;
  width: 36px; height: 36px;
  border-radius: 12px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.14);
  color: rgba(255,255,255,.85);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .2s;
  flex-shrink: 0;
}
#ce-back:hover { background: rgba(255,255,255,.18); transform: translateX(-2px); }
#ce-back svg { width: 18px; height: 18px; fill: currentColor; }

.ce-avatar {
  width: 40px; height: 40px;
  border-radius: 13px;
  background: rgba(255,255,255,.10);
  border: 1.5px solid rgba(255,255,255,.16);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 12px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.12);
}

.ce-hinfo { flex: 1; position: relative; z-index: 1; min-width: 0; }
.ce-hname {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: .2px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ce-hbrand { font-size: 10.5px; color: rgba(255,255,255,.45); margin-top: 2px; }
.ce-hstatus {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 5px;
}
.ce-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 6px rgba(74,222,128,.8);
  animation: ceBlink 2.2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes ceBlink {
  0%,100%{ opacity:1; box-shadow:0 0 6px rgba(74,222,128,.8) }
  50%    { opacity:.5; box-shadow:0 0 2px rgba(74,222,128,.3) }
}
.ce-hstatus span { font-size: 10px; color: rgba(255,255,255,.55); }

/* ══════════════════════════════════════════
   MENSAJES
══════════════════════════════════════════ */
.ce-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--ce-lift);
  scroll-behavior: smooth;
}
.ce-messages::-webkit-scrollbar { width: 3px; }
.ce-messages::-webkit-scrollbar-track { background: transparent; }
.ce-messages::-webkit-scrollbar-thumb { background: rgba(0,87,184,.15); border-radius: 3px; }

.ce-msg-group {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: ceMsgIn .28s cubic-bezier(.34,1.56,.64,1);
}
.ce-msg-group.ce-group-user { flex-direction: row-reverse; }
@keyframes ceMsgIn {
  from { opacity: 0; transform: translateY(10px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.ce-msg-avatar {
  width: 28px; height: 28px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--ce-blue), var(--ce-blue-deep));
  border: 1.5px solid rgba(0,87,184,.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,87,184,.2);
}

.ce-msg {
  max-width: 80%;
  padding: 11px 15px;
  font-size: 13.5px;
  line-height: 1.6;
  border-radius: 18px;
  white-space: pre-line;
  word-break: break-word;
}
.ce-bot {
  background: #fff;
  color: var(--ce-text);
  border-bottom-left-radius: 5px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.05);
  border: 1px solid rgba(0,87,184,.07);
}
.ce-user {
  background: linear-gradient(135deg, #1a6fdc 0%, var(--ce-blue) 50%, var(--ce-blue-deep) 100%);
  color: #fff;
  border-bottom-right-radius: 5px;
  box-shadow: 0 2px 8px rgba(0,87,184,.3), 0 6px 20px rgba(0,40,120,.2);
}

/* Typing */
.ce-typing {
  display: flex; gap: 5px; align-items: center;
  padding: 13px 16px;
  background: #fff;
  border-radius: 18px;
  border-bottom-left-radius: 5px;
  align-self: flex-start;
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.05);
  border: 1px solid rgba(0,87,184,.07);
  animation: ceMsgIn .28s cubic-bezier(.34,1.56,.64,1);
}
.ce-typing span {
  width: 7px; height: 7px;
  background: rgba(0,87,184,.25);
  border-radius: 50%;
  animation: ceBounce 1.1s ease-in-out infinite;
}
.ce-typing span:nth-child(2) { animation-delay: .18s; }
.ce-typing span:nth-child(3) { animation-delay: .36s; }
@keyframes ceBounce {
  0%,80%,100% { transform: translateY(0);    background: rgba(0,87,184,.25); }
  40%          { transform: translateY(-7px); background: var(--ce-blue); }
}

/* ══════════════════════════════════════════
   CHIPS
══════════════════════════════════════════ */
.ce-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 14px 8px;
  background: var(--ce-lift);
  border-top: 1px solid var(--ce-border);
  flex-shrink: 0;
}
.ce-chip {
  background: #fff;
  border: 1.5px solid rgba(0,87,184,.15);
  color: var(--ce-blue);
  font-family: 'DM Sans', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .2s cubic-bezier(.34,1.56,.64,1);
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,87,184,.08);
}
.ce-chip:hover {
  background: var(--ce-blue);
  color: #fff;
  border-color: var(--ce-blue);
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 4px 14px rgba(0,87,184,.35);
}
.ce-chip:active { transform: translateY(0) scale(.98); }

/* ══════════════════════════════════════════
   INPUT AREA
══════════════════════════════════════════ */
.ce-footer {
  padding: 12px 14px;
  background: var(--ce-surface);
  border-top: 1px solid var(--ce-border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
.ce-input-wrap { flex: 1; display: flex; align-items: flex-end; }
#ce-input {
  width: 100%;
  border: 1.5px solid var(--ce-border);
  border-radius: 14px;
  padding: 10px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13.5px;
  color: var(--ce-text);
  background: var(--ce-muted);
  resize: none;
  outline: none;
  max-height: 90px;
  overflow-y: auto;
  transition: border-color .22s, background .22s, box-shadow .22s;
  line-height: 1.5;
}
#ce-input:focus {
  border-color: var(--ce-blue);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,87,184,.1);
}
#ce-input::placeholder { color: #b8bfcc; }

#ce-send {
  width: 42px; height: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, #1a6fdc, var(--ce-blue-deep));
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s, opacity .2s;
  box-shadow: 0 3px 10px rgba(0,87,184,.35);
}
#ce-send:hover { transform: scale(1.1) translateY(-1px); box-shadow: 0 6px 18px rgba(0,87,184,.45); }
#ce-send:active { transform: scale(.96); }
#ce-send:disabled { opacity: .38; cursor: default; transform: none; box-shadow: none; }
#ce-send svg { width: 17px; height: 17px; fill: #fff; }

/* ══════════════════════════════════════════
   BRANDING
══════════════════════════════════════════ */
.ce-brand {
  text-align: center;
  padding: 7px 0 9px;
  font-size: 10.5px;
  color: #c0c6d3;
  background: var(--ce-surface);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  letter-spacing: .2px;
}
.ce-brand span { color: var(--ce-blue); font-weight: 700; }

/* ══════════════════════════════════════════
   RESPONSIVE – móvil panel full width
══════════════════════════════════════════ */
@media (max-width: 440px) {
  #ce-panel {
    width: 100%;
  }

  }
}
</style>

     LÓGICA DEL CHATBOT  (antes era chatbot.php)

  function ceObtenerRespuesta(mensaje) {
    const normalizado = mensaje.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita tildes para matching
      .trim();

    for (const item of RESPUESTAS) {
      for (const kw of item.keywords) {
        const kwNorm = kw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (normalizado.includes(kwNorm)) {
          return item.respuesta;
        }
      }
    }
    return RESPUESTA_DEFAULT;
  }

  /* ══════════════════════════════════════════════════════════
     UI
  ══════════════════════════════════════════════════════════ */
  const wrap    = document.getElementById('ce-chat-wrap');
  const toggle  = document.getElementById('ce-toggle');
  const overlay = document.getElementById('ce-overlay');
  const backBtn = document.getElementById('ce-back');
  const msgs    = document.getElementById('ce-messages');
  const input   = document.getElementById('ce-input');
  const sendBtn = document.getElementById('ce-send');
  const badge   = document.getElementById('ce-badge');

  let isOpen = false;
  let typingEl = null;

  function ceAbrir() {
    isOpen = true;
    wrap.classList.add('ce-open');
    badge.style.display = 'none';
    document.body.style.overflow = 'hidden'; // evita scroll del fondo en móvil
    if (msgs.children.length === 0) {
      ceAddBot('¡Hola! 👋 Soy el asistente de **CompuElectric**.\n\n¿En qué puedo ayudarte hoy?\nUsa los botones de abajo o escribe tu consulta.');
    }
    setTimeout(() => input.focus(), 420);
  }

  function ceCerrar() {
    isOpen = false;
    wrap.classList.remove('ce-open');
    document.body.style.overflow = '';
  }

  toggle.addEventListener('click', () => { isOpen ? ceCerrar() : ceAbrir(); });
  backBtn.addEventListener('click', ceCerrar);
  overlay.addEventListener('click', ceCerrar);

  // Enter para enviar
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ceEnviar(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  });
  sendBtn.addEventListener('click', ceEnviar);

  // Cerrar con Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen) ceCerrar();
  });

  function ceEnviar() {
    const txt = input.value.trim();
    if (!txt) return;
    ceAddUser(txt);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    ceMostrarTyping();

    // Simula un pequeño delay (~400–900ms) para que se sienta natural
    const delay = 400 + Math.random() * 500;
    setTimeout(() => {
      const respuesta = ceObtenerRespuesta(txt);
      ceAddBot(respuesta);
      sendBtn.disabled = false;
      input.focus();
    }, delay);
  }

  window.ceChip = function (btn) {
    const txt = btn.textContent.replace(/[^\w\sáéíóúüñÁÉÍÓÚÜÑ]/gu, '').trim();
    ceAddUser(btn.textContent.trim());
    sendBtn.disabled = true;
    ceMostrarTyping();
    const delay = 400 + Math.random() * 500;
    setTimeout(() => {
      const respuesta = ceObtenerRespuesta(txt);
      ceAddBot(respuesta);
      sendBtn.disabled = false;
    }, delay);
  };

  function ceAddUser(txt) {
    const d = document.createElement('div');
    d.className = 'ce-msg ce-user';
    d.textContent = txt;
    msgs.appendChild(d);
    ceScroll();
  }

  function ceAddBot(txt) {
    ceQuitarTyping();
    const d = document.createElement('div');
    d.className = 'ce-msg ce-bot';
    d.innerHTML = txt
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    msgs.appendChild(d);
    ceScroll();
  }

  function ceMostrarTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'ce-typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(typingEl);
    ceScroll();
  }

  function ceQuitarTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function ceScroll() { msgs.scrollTop = msgs.scrollHeight; }
